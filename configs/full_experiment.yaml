# Moderate-size reproducible factorial experiment. Increase seeds/levels only after
# the quick test and pilot run are stable. Every factor is saved in raw_results.csv.
topologies: [linear, branching, parallel_merge, layered]
workflow_sizes: [6, 10]
seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110]
failure_probabilities: [0.0, 0.1, 0.25]
detection_coverages: [0.5, 1.0]
audit_sensitivities: [0.5, 1.0]
audit_false_positive_rates: [0.0, 0.02]
failure_kinds: [transient, corruption]
max_occurrences: 1
max_retries: 2
validation_enabled: true
strategies: [none, full_restart, failed_task_retry, dependency_aware]
