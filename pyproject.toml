[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-aware-recovery"
version = "0.2.0"
description = "Reproducible simulator for dependency-aware recovery in multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recovery-research = "recovery_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
